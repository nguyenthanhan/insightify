# Cloudflare Pages Configuration
# This file is optional but provides better control over deployment settings

name = "insightify"
compatibility_date = "2024-01-01"

# Pages configuration
pages_build_output_dir = "dist"

# Compatibility flags for Pages Functions
compatibility_flags = ["nodejs_compat"]

# Environment variables (secrets should be set via CLI or Dashboard)
# DO NOT put actual API keys here!
[env.production]
# OPENAI_API_KEY = "set via: wrangler pages secret put OPENAI_API_KEY"
# ANTHROPIC_API_KEY = "set via: wrangler pages secret put ANTHROPIC_API_KEY"

[env.preview]
# Preview environment for testing
# OPENAI_API_KEY = "set via: wrangler pages secret put OPENAI_API_KEY --env preview"
# ANTHROPIC_API_KEY = "set via: wrangler pages secret put ANTHROPIC_API_KEY --env preview"
